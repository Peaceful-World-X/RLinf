# Offline TD3+BC training on online trajectory data
# Source: 20260625-09:42:44-realworld_piper_cubeinsert_pi05_eval_with_reward
# Experiment: residual actor, q_weight=0.1, bc_weight=50
#
# Run like other embodiment examples:
#   bash examples/embodiment/run_offline_train_openrlt.sh offline_train_on_online122_residual_q010_new_image_last_linear

# --- Path roots ---
online_log_dir: /home/focal/shared_disk/users/kwj/RLinf/logs/20260703-05:14:40-realworld_piper_peginsertion_td3_rl_token_online
output_name: offline_train_on_online122_residual_q010_new_image_last_linear
data_dir: /home/focal/shared_disk/users/kwj/RLinf/logs/20260703-05:14:40-realworld_piper_peginsertion_td3_rl_token_online/replay_buffer/rank_0 #更改路径
feature_cache: /home/focal/shared_disk/users/kwj/RLinf/logs/20260703-05:14:40-realworld_piper_peginsertion_td3_rl_token_online/online_prefix_tokens_image_last_linear.pt #第一次训练需要重新生成
generate_feature_cache_if_missing: true
feature_cache_batch_size: 8
feature_cache_task_description: "peg and insertion"
feature_cache_model_config: /home/focal/shared_disk/users/kwj/RLinf/examples/embodiment/config/realworld_piper_cubeinsert_pi05_eval_with_reward.yaml

# --- Fixed paths ---
norm_stats_path: /home/focal/shared_disk/users/kwj/weight/openpi/pi05_charge_insert/norm_stats.json #更改路径
urdf_path: /home/focal/shared_disk/users/kwj/RLinf/assets/piper_local_assets/piper.urdf
model_path: /home/focal/shared_disk/users/kwj/weight/openpi/pi05_charge_insert #更改路径
rl_token_path: null

# --- RL token extraction ---
# Use image tokens plus the full-prefix last token through actor/critic sequence linears.
rl_token_source: image_last_linear
prefix_feature_type: full_prefix
num_image_tokens: 768
actor_train_prefix_token_linear: true
critic_train_prefix_token_linear: true

# Read prefix tokens from the saved feature_cache (not realtime VLA inference).
# load_dataset() mmaps the ~16GB cache and only pages in the rows a batch
# actually indexes, so this avoids the load_dataset OOM without needing to
# re-run the frozen VLA forward pass every step.
realtime_prefix_features: false

# --- Training schedule ---
max_steps: 2000
batch_size: 256
gpu: 0
save_interval: 50
log_interval: 10
patience: 700
viz_per_class: 5
chunk_len: 15

# --- RL hyper-parameters ---
gamma: 0.94
n_step: 40
bc_weight: 50.0
q_weight: 0.1
q_warmup_steps: 0
delta_weight: 10.0
joint_abs_weight: 100.0
tcp_weight: 5000.0
tcp_boundary_weight: 1000.0

# --- Actor ---
actor_residual_ref: true
actor_residual_scale: 1.0

# --- Dataset sampling ---
warm_up_chunks: 16 #对应任务更改warm_up_chunks长度

# --- TCP geometry (disabled when radius <= 0) ---
tcp_radius: 0.0
tcp_filter_mode: chunk_center   # choices: chunk_center | chunk_end | state
tcp_target: [0.2818035953, 0.0385303870, 0.0602531905]
