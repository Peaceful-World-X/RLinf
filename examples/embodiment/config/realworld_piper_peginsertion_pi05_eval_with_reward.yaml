# Piper dual-arm + pi0.5 real-world eval with keyboard reward labeling.
# Supports pure pi0.5 (model_type=openpi) and pi0.5+RLToken+TD3 (model_type=openpi_rl_token).
#
# Run:
#   bash examples/embodiment/run_realworld_eval_with_reward.sh \
#       realworld_piper_peginsertion_pi05_eval_with_reward

defaults:
  - env/realworld_piper_peg_insertion@env.eval
  - model/pi0_5@actor.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: piper
      placement: 0
  node_groups:
    - label: piper
      node_ranks: 0

runner:
  task_type: embodied
  logger:
    log_path: null
    project_name: rlinf
    experiment_name: "piper_pi05_eval_with_reward"
    logger_backends: ["tensorboard"]
  num_data_episodes: 10
  record_task_description: False

env:
  group_name: "EnvGroup"
  eval:
    keyboard_reward_wrapper: null   # reward given manually after each rollout
    auto_reset: False
    ignore_terminations: False
    max_steps_per_rollout_epoch: 5000   # 30 Hz * ~167 s; must be divisible by num_action_chunks
    max_episode_steps: 5000
    override_cfg:
      is_dummy: False
      joint_action_mode: absolute
      success_hold_steps: 1
      enable_human_intervention: True
      camera_names:
        - cam_high
        - cam_left_wrist
        - cam_right_wrist
      img_topics:
        - /camera_f/color/image_raw
        - /camera_l/color/image_raw
        - /camera_r/color/image_raw
      obs_img_resolution: [480, 640]

rollout:
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  model:
    model_path: "/home/focal/shared_disk/users/kwj/weight/openpi/pi05_plug_cable"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: false
    num_steps: 5
    openpi:
      config_name: "pi05_aloha_robotwin"
      num_images_in_input: 3
      noise_level: 0.3
      train_expert_only: true
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      detach_critic_input: null
