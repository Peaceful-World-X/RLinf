# Online TD3 config for GigaCL charge-insert weights.
# Loads actor/critic from the joint offline run. The intervention classifier is
# disabled; VLA controls the first 20 chunks, then the actor controls rollout.
# Prefix-token compression layers are loaded from the checkpoint but frozen
# during real-world RL.
#
# Usage:
#   bash examples/embodiment/run_piper_online_td3.sh realworld_piper_gigacl_charge_insert_online

defaults:
  - env/realworld_piper_peg_insertion@env.train
  - env/realworld_piper_peg_insertion@env.eval
  - model/pi0_5_rl_token@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: 0-0
    rollout: 0-0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "piper_gigacl_charge_insert_online"
    logger_backends: ["tensorboard"]

  max_epochs: 100000
  max_steps: 100000
  only_eval: False
  val_check_interval: -1
  save_interval: 50
  actor_critic_only_checkpoint: True
  reset_global_step_on_resume: True
  load_optimizer_on_actor_critic_resume: False
  log_interval: 20
  weight_sync_interval: 50
  resume_dir: "/home/focal/shared_disk/users/kwj/RLinf/logs/20260723-10:11:47-realworld_charge_insert_offline/openrlt/checkpoints/global_step_1000"
  ckpt_path: null

algorithm:
  loss_type: embodied_td3
  sampling_params:
    do_sample: false
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
  adv_type: null

  gamma: 0.94
  n_step: 10
  tau: 0.05
  update_epoch: 1
  critic_actor_ratio: 1
  target_update_freq: 1
  target_policy_noise: 0.05
  target_noise_clip: 0.1
  target_action_clip: 1.2
  critic_target_action_source: "actor"
  behavior_action_clip: null
  bc_coef: 50.0
  actor_q_coef: 0.1
  critic_td_coef: 1.0
  critic_mc_return_coef: 0.0
  critic_train_rl_token_encoder: False
  critic_separate_rl_token_encoder: False
  critic_train_representation: False

  rollout_epoch: 1
  eval_rollout_epoch: 1
  stage_actor_bc_only: False
  stage_freeze_actor: False
  tail_curriculum:
    enabled: true
    start_window: 20
    end_window: 20
    hold_steps: 0
    warmup_steps: 1

  replay_buffer:
    enable_cache: True
    cache_size: 10
    min_buffer_size: 2
    sample_window_size: 10
    auto_save: True
    delete_last_on_key: True
    delete_last_key: "d"
    trajectory_format: "pt"
    prefetch_size: 1
    save_executor_workers: 2
    checkpoint_executor_workers: 2
    exclude_warmup_chunks_from_training: true
    preload_checkpoint_path: /home/focal/shared_disk/users/kwj/RLinf/logs/20260724-10:20:52-realworld_piper_gigacl_charge_insert_online/replay_buffer/rank_0 #实际为replay_buffer_path
    cache_obs_keys:
      - actor_rl_token
      - critic_rl_token_1
      - critic_rl_token_2
      - states
      - robot_state
      - ref_action
    cache_forward_input_keys:
      - action
      - executed_action
      - model_action
      - ref_action
      - mc_return
      - rollout_control_source

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 1
    keyboard_reward_wrapper: single_stage
    auto_reset: False
    ignore_terminations: False
    break_chunk_after_intervention: true
    break_chunk_on_intervention_change: true
    save_substep_obs: true
    max_steps_per_rollout_epoch: 4995
    max_episode_steps: 5000
    override_cfg:
      is_dummy: false
      joint_action_mode: absolute
      delta_action_scale: 0.01
      success_hold_steps: 1
      enable_human_intervention: true
      camera_names:
        - cam_high
        - cam_left_wrist
        - cam_right_wrist
      img_topics:
        - /camera_f/color/image_raw
        - /camera_l/color/image_raw
        - /camera_r/color/image_raw
      obs_img_resolution: [224, 224]
      sliding_window_action_buffer: true
      smooth_action_chunk: true
      use_tcp_reset_pose_pool: false
      tcp_reset_pose_pool_path: "/home/focal/shared_disk/users/kwj/RLinf/assets/piper_tcp_reset_poses_10cm.json"
      tcp_reset_random_seed: 20260620
      tcp_reset_interpolate_steps: 20

  eval:
    total_num_envs: 1
    auto_reset: False
    ignore_terminations: False
    override_cfg:
      is_dummy: true
      joint_action_mode: absolute
      enable_human_intervention: false
      camera_names:
        - cam_high
        - cam_left_wrist
        - cam_right_wrist
      img_topics:
        - /camera_f/color/image_raw
        - /camera_l/color/image_raw
        - /camera_r/color/image_raw
      obs_img_resolution: [224, 224]

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  warm_up_chunk_steps: 20
  vla_warmup_chunk_steps: 20
  online_control:
    save_substep_obs: true
    print_status: true
    print_status_actor_only: true
    print_status_interval: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 64
  seed: 1234
  enable_offload: false
  sync_weight_no_wait: true
  recv_drain_max_trajectories: 64

  model:
    model_path: "/home/focal/shared_disk/users/kwj/weight/openpi/pi05_install_connecting_rod" #更改路径
    rl_token_path: null
    freeze_rl_token: True
    critic_train_rl_token_encoder: ${algorithm.critic_train_rl_token_encoder}
    critic_separate_rl_token_encoder: ${algorithm.critic_separate_rl_token_encoder}
    recon_loss_coef: 0.0
    actor_output_bound: 1.2
    actor_smooth_loss_coef: 10.0
    actor_head_type: "openrlt_mlp"
    critic_head_type: "openrlt_mlp"
    rl_token_source: "image_last_linear"
    replay_embedding_mode: "frozen_image_last_linear"
    replay_embedding_batch_size: 8
    prefix_feature_type: "full_prefix"
    num_image_tokens: 768
    actor_train_prefix_token_linear: False
    critic_train_prefix_token_linear: False
    openrlt_z_proj_dim: 256
    openrlt_state_proj_dim: 64
    openrlt_action_proj_dim: 256
    openrlt_hidden_dim: 256
    openrlt_num_layers: 2
    use_robot_state: True
    critic_use_robot_state: True
    critic_use_ref_action: False
    actor_residual_ref: True
    actor_residual_scale: 1.0
    action_space: "normalized_delta"
    action_norm_stats_path: "/home/focal/shared_disk/users/kwj/weight/openpi/pi05_install_connecting_rod/norm_stats.json" #更改路径
    action_norm_std_floor: 1.0
    # Actor/critic train only the right arm; rollout still executes full 14D
    # absolute Piper actions by keeping the left arm on the VLA reference action.
    action_dim: 6
    robot_state_dim: 6
    env_action_dim: 14
    controlled_action_indices: [7, 8, 9, 10, 11, 12]
    num_action_chunks: 15
    num_steps: 5
    rollout_control_mode: "warmup"
    intervention_classifier_path: null
    intervention_classifier_threshold: 0.8
    rollout_gate_mse_threshold: 9.0e-3
    rollout_gate_disable_mse_threshold: 1.2e-2
    rollout_gate_stable_chunks: 3
    rollout_gate_warmup_chunks: 3
    rollout_gate_require_gripper_closed: false
    rollout_gate_gripper_state_index: 13
    rollout_gate_gripper_closed_threshold: 0.035
    rollout_gate_gripper_stable_chunks: 2
    openpi:
      config_name: "pi05_aloha_cubeinsert"
      num_images_in_input: 3
      noise_level: 0.3
      train_expert_only: True
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.env_action_dim}
      num_steps: ${actor.model.num_steps}
      detach_critic_input: null

  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    lr_scheduler: torch_constant

  critic_optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    lr_scheduler: torch_constant

  fsdp_config:
    use_orig_params: True
    strategy: "fsdp"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
