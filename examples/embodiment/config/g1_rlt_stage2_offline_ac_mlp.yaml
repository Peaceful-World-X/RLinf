defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: "0-3"                                                # 四张训练卡，编号 0–3
    env: 0
    rollout: 0

runner:
  task_type: offline
  logger:
    # 阶段 2 的日志与权重输出目录
    log_path: /16T-2/sudu/code/.result2/RLT/RLinf/g1_actor/train_run
    project_name: rlinf-rlt
    experiment_name: train
    logger_backends: [tensorboard]
  max_epochs: 10000                                             # 训练循环上限
  max_steps: 10000                                              # critic 更新上限；本配置对应 5000 次 actor 更新
  local_update_steps: 1
  log_interval: 1                                               # 每次更新记录 loss，保留完整训练曲线
  only_eval: false
  val_check_interval: -1                                        # 关闭入口内定期验证，由工作流保存后独立验证
  eval_episodes: 0
  save_interval: 500                                            # 每 500 次 critic 更新保存一次权重
  resume_dir: null                                              # 完整断点恢复目录；null 表示不恢复
  ckpt_path: null

algorithm:
  loss_type: rlt_ac
  adv_type: embodied_sac
  loss_agg_func: token-mean
  update_epoch: 1
  group_size: 1
  q_head_type: default
  q_weight: 0.1                                                 # Q 项权重，越大越强调价值优化
  bc_weight: 5.0                                                # 未启用下面两项时使用的统一 BC 权重
  # 以下两项同时设置；成功标记决定是否计算 BC，失败片段仍参与 Q 学习
  human_bc_weight: 50.0                                         # 成功人工步：拟合实际人工动作
  autonomous_bc_weight: 5.0                                     # 成功自主步：拟合 VLA 参考动作
  reference_dropout_prob: 0.5                                   # 训练时丢弃 VLA 参考输入的概率
  actor_weight_schedule:
    enable: false                                               # 是否随训练步数调整 BC/Q 权重
  bootstrap_type: standard
  gamma: 0.96                                                   # 每帧奖励折扣；H10 的后续价值乘 gamma**10
  tau: 0.005                                                    # 目标价值网络的软更新比例
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    # 阶段 1 特征缓存；工作流准备成功掩码后写入新的回放目录
    load_path: /16T-2/sudu/code/.result2/RLT/RLinf/zd89_actor_six_20261029_1445/feature_replay
    enable_cache: true
    cache_size: 89                                              # 内存回放缓存容纳的轨迹数
    sample_window_size: 0                                       # 0 表示从全部已加载轨迹中采样
    min_buffer_size: 1                                          # 启动采样所需的最少轨迹数
    auto_save: true
  rlt_schedule:
    enable: false
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 1
  critic_actor_ratio: 2                                         # critic:actor 更新次数比＝2:1
  critic_subsample_size: 0
  backup_entropy: false

# 离线训练关闭环境评估时，不启动 env/rollout 工作进程。
env:
  group_name: EnvGroup
rollout:
  group_name: RolloutGroup
  pipeline_stage_num: 1

actor:
  group_name: ActorGroup
  training_backend: fsdp
  seed: 42
  seed_global_rng: true
  micro_batch_size: 64                                          # 每卡单次训练的样本数
  global_batch_size: 256                                        # 四卡合计 batch，与每卡 64 对应
  enable_offload: false
  model:
    model_type: rlt_mlp_policy
    model_path: null
    precision: fp32
    add_value_head: false
    add_q_head: true
    q_head_type: default
    fixed_std: 0.002                                            # 训练时动作采样噪声的标准差
    is_lora: false
    z_dim: 2048                                                 # 输入 RLToken 的特征维度
    proprio_dim: 16                                             # 输入状态维度：14 个关节＋2 个夹爪
    action_dim: 16                                              # 每步输出 16 维动作
    num_action_chunks: 10                                       # actor 每次输出 10 步动作
    ref_num_action_chunks: 20                                   # 提供 20 步 VLA 参考，actor 使用前 10 步
    action_anchor: state                                        # 最终动作＝查询状态＋修正量，使用共同归一化
    action_output_scale: 2.0                                    # tanh 输出乘 2，修正量范围为归一化后的 ±2
  optim:
    lr: 3.0e-4                                                  # actor 学习率
    lr_scheduler: torch_constant
    clip_grad: 10.0
  critic_optim:
    lr: 3.0e-4                                                  # critic 学习率
    lr_scheduler: torch_constant
    clip_grad: 10.0
  fsdp_config:
    sharding_strategy: no_shard                                 # 不分片，各卡同步梯度
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false
critic:
  use_critic_model: false
