actor:
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
    wrappers: {}
    mixed_precision_policies: {}
    mixed_precision_rules: {}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  seed: 42
  micro_batch_size: 128
  global_batch_size: 256
  enable_offload: false
  model:
    model_type: rlt_mlp_policy
    model_path: null
    precision: fp32
    add_value_head: false
    add_q_head: true
    q_head_type: default
    fixed_std: 0.002
    is_lora: false
    z_dim: 2048
    proprio_dim: 14
    action_dim: 14
    num_action_chunks: 10
    ref_num_action_chunks: 10
    g1_action_mode: state_delta
    g1_action_norm_stats_path: /mnt/20T-1/sudu/.result/g1_rlt/20261027_1042/assets/norm_stats.json
  optim:
    lr: 0.0003
    lr_scheduler: torch_constant
    clip_grad: 10.0
  critic_optim:
    lr: 0.0003
    lr_scheduler: torch_constant
    clip_grad: 10.0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor: 0
    env: 0
    rollout: 0
runner:
  task_type: offline
  logger:
    log_path: /mnt/20T-1/sudu/.data/RLinf/g1_actor_splitbc/20261029_1748/runs/state_delta_h50_p5
    project_name: rlinf-rlt
    experiment_name: training
    logger_backends:
    - tensorboard
  max_epochs: 20000
  max_steps: 20000
  local_update_steps: 1
  log_interval: 5
  only_eval: false
  val_check_interval: -1
  eval_episodes: 0
  save_interval: 500
  resume_dir: null
  ckpt_path: null
  offline_eval_interval: 500
  offline_early_stop:
    enable: false
    metric: human_joint_mse_radians
    min_steps: 5000
    patience: 5
    relative_improvement: 0.005
algorithm:
  loss_type: rlt_ac
  adv_type: embodied_sac
  loss_agg_func: token-mean
  update_epoch: 1
  group_size: 1
  q_head_type: default
  q_weight: 0.1
  bc_weight: 5
  bc_human_weight: 50  # 人工纠正帧，学习记录的人工动作；设置后覆盖统一 bc_weight
  bc_policy_weight: 5  # 自主成功帧，保持 VLA reference；自主失败帧仅参与 Q 学习
  reference_dropout_prob: 0.5
  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    load_path: /mnt/20T-1/sudu/.data/RLinf/g1_actor_splitbc/20261029_1748/features/train
    enable_cache: true
    cache_size: 89
    sample_window_size: 89
    min_buffer_size: 1
    auto_save: false
  rlt_schedule:
    enable: false
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 1
  critic_actor_ratio: 2
  critic_subsample_size: 0
  backup_entropy: false
  offline_validation_path: /mnt/20T-1/sudu/.data/RLinf/g1_actor_ablation/20261029_1422/features/validation.pt
env:
  group_name: EnvGroup
rollout:
  group_name: RolloutGroup
  pipeline_stage_num: 1
reward:
  use_reward_model: false
critic:
  use_critic_model: false
