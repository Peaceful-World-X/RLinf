# Piper dual-arm + pure pi0.5 real-world eval.
#
# This config intentionally does not use pi0_5_rl_token or TD3 actor heads.
#
# Run:
#   bash examples/embodiment/run_realworld_eval.sh realworld_piper_peginsertion_pi05_eval

defaults:
  - env/realworld_piper_peg_insertion@env.train
  - env/realworld_piper_peg_insertion@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: 0-0
    rollout: 0-0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "piper_pi05_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: 1
  only_eval: true
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

algorithm:
  # Eval only. Use the embodied TD3 schema so pure pi0.5 does not need a PPO
  # value head or an RLToken actor head.
  loss_type: embodied_td3
  sampling_params:
    do_sample: false
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
  adv_type: null

  gamma: 0.99
  tau: 0.005
  update_epoch: 1
  critic_actor_ratio: 2
  target_update_freq: 1
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  bc_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  stage_actor_bc_only: false
  stage_freeze_actor: false

  actor_bc_guard:
    mode: "none"
    threshold: 0.004
    weighted_bc_coef: 50.0
    hard_penalty_coef: 5000.0
    hard_penalty_power: 1.0

  replay_buffer:
    enable_cache: true
    cache_size: 10
    min_buffer_size: 100
    sample_window_size: 10
    auto_save: false
    prefetch_size: 2

env:
  group_name: "EnvGroup"

  # Kept only because parts of EnvWorker still expect env.train to exist.
  # runner.only_eval=true means this train env is not instantiated.
  train:
    total_num_envs: 1
    override_cfg:
      is_dummy: true
      joint_action_mode: absolute
      success_hold_steps: 1
      enable_human_intervention: false
      camera_names:
        - cam_high
        - cam_left_wrist
        - cam_right_wrist
      img_topics:
        - /camera_f/color/image_raw
        - /camera_l/color/image_raw
        - /camera_r/color/image_raw
      obs_img_resolution: [224, 224]

  eval:
    total_num_envs: 1
    auto_reset: false
    max_steps_per_rollout_epoch: 108000  # 30 Hz * 3600 s; must be divisible by 50.
    max_episode_steps: 108000
    override_cfg:
      is_dummy: false
      joint_action_mode: absolute
      success_hold_steps: 1
      enable_human_intervention: false
      camera_names:
        - cam_high
        - cam_left_wrist
        - cam_right_wrist
      img_topics:
        - /camera_f/color/image_raw
        - /camera_l/color/image_raw
        - /camera_r/color/image_raw
      obs_img_resolution: [224, 224]

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: false
  collect_prev_infos: false
  sync_weight_nccl_max_ctas: 32
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 1234
  enable_offload: false

  model:
    model_path: "/home/ubuntu/user/chenshiyi/tos_downloads/pi05_weights/pi05_plug_cable"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: false
    num_steps: 5
    openpi:
      config_name: "pi05_aloha_robotwin"
      num_images_in_input: 3
      noise_level: 0.3
      train_expert_only: true
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      detach_critic_input: null

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
