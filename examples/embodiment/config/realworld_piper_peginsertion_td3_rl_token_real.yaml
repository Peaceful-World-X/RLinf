# Piper 双臂 + TD3 + RLToken：真机模式
#
# 运行示例：
#   bash examples/embodiment/run_realworld_async.sh realworld_piper_peginsertion_td3_rl_token_real

defaults:
  - env/realworld_piper_peg_insertion@env.train
  - env/realworld_piper_peg_insertion@env.eval
  - model/pi0_5_rl_token@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: 0-0
    rollout: 0-0

runner:
  task_type: offline
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "piper_td3_rl_token_real"
    logger_backends: ["tensorboard"]

  max_epochs: 100000
  max_steps: 2000
  local_update_steps: 1

  only_eval: False
  val_check_interval: -1
  save_interval: 50
  save_initial_checkpoint: True
  actor_critic_only_checkpoint: True
  log_interval: 20
  weight_sync_interval: 1

  resume_dir: null
  ckpt_path: null
  offline_validation_visualization:
    enabled: True
    minimal: True
    data_paths:
      - "/home/focal/shared_disk/users/kwj/RLinf/logs/20260609-07:59:29-realworld_piper_cubeinsert_pi05_eval_with_reward/demos_fail_reward0_normdelta"
    split_success_failure: True
    num_success_trajectories: 1
    num_failure_trajectories: 1
    num_trajectories: 2
    num_chunks_per_trajectory: 6
    index_mode: "terminal_window"
    urdf_path: "/home/focal/shared_disk/users/kwj/RLinf/assets/piper_local_assets/piper.urdf"
    base_link: "base_link"
    tip_link: "gripper"
    joint_action_mode: "normalized_delta"
    action_norm_stats_path: "/home/focal/shared_disk/users/kwj/weight/openpi/pi05_cube_insert/norm_stats.json"
    action_norm_std_floor: 1.0
    delta_visualization_anchor: "robot_state"
    delta_action_scale: 0.01
    dual_arm_base_offsets:
      - [0.0, 0.22, 0.0]
      - [0.0, -0.22, 0.0]
    min_qpos: [-2.618, 0.0, -2.967, -1.745, -1.22, -2.0944, 0.0]
    max_qpos: [2.618, 3.14, 0.0, 1.745, 1.22, 2.0944, 1.0]

algorithm:
  loss_type: embodied_td3
  sampling_params:
    do_sample: false
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
  adv_type: null

  gamma: 0.96
  n_step: 10
  tau: 0.05
  update_epoch: 1
  critic_actor_ratio: 1
  target_update_freq: 1
  target_policy_noise: 0.0
  target_noise_clip: 0.0
  target_action_clip: 1.2
  critic_target_action_source: "data_next"
  behavior_action_clip: null
  bc_coef: 50.0
  actor_q_coef: 0.0
  critic_td_coef: 1.0
  critic_mc_return_coef: 0.0
  critic_train_rl_token_encoder: False
  critic_separate_rl_token_encoder: False
  critic_train_representation: False

  training_stages:
    actor_critic_coupling_start_step: 800
    coupled_critic_target_action_source: "actor"
    coupled_actor_q_coef: 0.1
    coupled_bc_coef: 50.0
    coupled_target_policy_noise: 0.05
    coupled_target_noise_clip: 0.1
    coupled_target_action_clip: 1.2

  tail_curriculum:
    enabled: True
    start_window: 1
    hold_steps: 100
    end_window: 96
    warmup_steps: 1000

  rollout_epoch: 1
  eval_rollout_epoch: 1

  stage_actor_bc_only: False
  stage_freeze_actor: False

  actor_bc_guard:
    mode: "none"
    threshold: 0.004
    weighted_bc_coef: 50.0
    hard_penalty_coef: 5000.0
    hard_penalty_power: 1.0

  offline_data_paths:
    - "/home/focal/shared_disk/users/kwj/RLinf/logs/20260609-07:59:29-realworld_piper_cubeinsert_pi05_eval_with_reward/demos_fail_reward0_normdelta"
  task_descriptions: "insert the cube"

  replay_buffer:
    enable_cache: True
    cache_size: 10
    min_buffer_size: 100
    sample_window_size: 205
    auto_save: False
    prefetch_size: 2

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 1
    override_cfg:
      is_dummy: false
      joint_action_mode: absolute
      delta_action_scale: 0.01
      success_hold_steps: 1
      enable_human_intervention: false
      camera_names:
        - cam_high
        - cam_left_wrist
        - cam_right_wrist
      img_topics:
        - /camera_f/color/image_raw
        - /camera_l/color/image_raw
        - /camera_r/color/image_raw
      obs_img_resolution: [224, 224]

  eval:
    total_num_envs: 1
    keyboard_reward_wrapper: single_stage
    auto_reset: False
    ignore_terminations: False
    break_chunk_after_intervention: true
    max_steps_per_rollout_epoch: 5000
    max_episode_steps: 5000
    override_cfg:
      is_dummy: false
      joint_action_mode: absolute
      delta_action_scale: 0.01
      success_hold_steps: 1
      enable_human_intervention: true
      camera_names:
        - cam_high
        - cam_left_wrist
        - cam_right_wrist
      img_topics:
        - /camera_f/color/image_raw
        - /camera_l/color/image_raw
        - /camera_r/color/image_raw
      obs_img_resolution: [224, 224]
      sliding_window_action_buffer: true

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  warm_up_chunk_steps: 3
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 8
  global_batch_size: 64
  seed: 1234
  enable_offload: false

  model:
    model_path: "/home/focal/shared_disk/users/kwj/weight/openpi/pi05_cube_insert"
    rl_token_path: "/home/focal/shared_disk/users/kwj/weight/rltoken/pi05_cube_insert/pi05_cube_insert/10000"
    freeze_rl_token: True
    critic_train_rl_token_encoder: ${algorithm.critic_train_rl_token_encoder}
    critic_separate_rl_token_encoder: ${algorithm.critic_separate_rl_token_encoder}
    recon_loss_coef: 0.0
    actor_output_bound: 1.2
    actor_head_type: "mlp"
    actor_transformer_dim: 256
    actor_transformer_layers: 2
    actor_transformer_heads: 8
    actor_transformer_ffn_dim: 1024
    actor_transformer_dropout: 0.1
    use_robot_state: False
    critic_use_robot_state: True
    action_space: "normalized_delta"
    action_norm_stats_path: "/home/focal/shared_disk/users/kwj/weight/openpi/pi05_cube_insert/norm_stats.json"
    action_norm_std_floor: 1.0
    action_dim: 14
    num_action_chunks: 10
    num_steps: 5
    openpi:
      config_name: "pi05_aloha_cubeinsert"
      num_images_in_input: 3
      noise_level: 0.3
      train_expert_only: True
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      detach_critic_input: null

  optim:
    lr: 1.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    lr_scheduler: torch_constant

  critic_optim:
    lr: 1.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    lr_scheduler: torch_constant

  fsdp_config:
    use_orig_params: True
    strategy: "fsdp"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
