# Piper 双臂 + TD3 + RLToken：真机模式
#
# 运行示例：
#   bash examples/embodiment/run_realworld_async.sh realworld_piper_peginsertion_td3_rl_token_real

defaults:
  - env/realworld_piper_peg_insertion@env.train
  - env/realworld_piper_peg_insertion@env.eval
  - model/pi0_5_rl_token@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: 0-0
    rollout: 0-0

runner:
  task_type: offline
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "piper_td3_rl_token_real"
    logger_backends: ["tensorboard"]

  max_epochs: 100000
  max_steps: 100000
  local_update_steps: 1

  only_eval: False
  val_check_interval: -1
  save_interval: 500
  log_interval: 20
  weight_sync_interval: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  loss_type: embodied_td3
  sampling_params:
    do_sample: false
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
  adv_type: null

  gamma: 0.99
  tau: 0.005
  update_epoch: 1
  critic_actor_ratio: 10
  target_update_freq: 1
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  bc_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  stage_actor_bc_only: False
  stage_freeze_actor: False

  actor_bc_guard:
    mode: "none"
    threshold: 0.004
    weighted_bc_coef: 50.0
    hard_penalty_coef: 5000.0
    hard_penalty_power: 1.0

  offline_data_paths:
    - "/home/focal/shared_disk/users/kwj/RLinf/logs/20260605-11:28:09-realworld_piper_cubeinsert_pi05_eval_with_reward/demos"
    - "/home/focal/shared_disk/users/kwj/RLinf/logs/20260609-07:59:29-realworld_piper_cubeinsert_pi05_eval_with_reward/demos"
  task_descriptions: "insert the cube"

  replay_buffer:
    enable_cache: True
    cache_size: 10
    min_buffer_size: 100
    sample_window_size: 205
    auto_save: False
    prefetch_size: 2

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 1
    override_cfg:
      is_dummy: false
      joint_action_mode: absolute_normalized
      delta_action_scale: 0.01
      success_hold_steps: 1
      enable_human_intervention: false
      camera_names:
        - cam_high
        - cam_left_wrist
        - cam_right_wrist
      img_topics:
        - /camera_f/color/image_raw
        - /camera_l/color/image_raw
        - /camera_r/color/image_raw
      obs_img_resolution: [224, 224]

  eval:
    total_num_envs: 1
    keyboard_reward_wrapper: single_stage
    auto_reset: False
    ignore_terminations: False
    break_chunk_after_intervention: true
    max_steps_per_rollout_epoch: 5000
    max_episode_steps: 5000
    override_cfg:
      is_dummy: false
      joint_action_mode: absolute_normalized
      delta_action_scale: 0.01
      success_hold_steps: 1
      enable_human_intervention: true
      camera_names:
        - cam_high
        - cam_left_wrist
        - cam_right_wrist
      img_topics:
        - /camera_f/color/image_raw
        - /camera_l/color/image_raw
        - /camera_r/color/image_raw
      obs_img_resolution: [224, 224]
      sliding_window_action_buffer: true

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  warm_up_chunk_steps: 3
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 8
  global_batch_size: 32
  seed: 1234
  enable_offload: false

  model:
    model_path: "/home/focal/shared_disk/users/kwj/weight/openpi/pi05_cube_insert"
    rl_token_path: "/home/focal/shared_disk/users/kwj/weight/rltoken/pi05_cube_insert/pi05_cube_insert/10000"
    action_dim: 14
    num_action_chunks: 10
    num_steps: 5
    openpi:
      config_name: "pi05_aloha_cubeinsert"
      num_images_in_input: 3
      noise_level: 0.3
      train_expert_only: True
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      detach_critic_input: null

  policy_head:
    enable_critic_q_upper_bound: True
    critic_q_upper_bound: 1.0
    actor_q_loss_clamp_to_upper_bound: True
    critic_target_clamp_to_upper_bound: True
    critic_overshoot_penalty_coef: 1.0

  optim:
    lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    lr_scheduler: torch_constant

  critic_optim:
    lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    lr_scheduler: torch_constant

  fsdp_config:
    use_orig_params: True
    strategy: "fsdp"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
