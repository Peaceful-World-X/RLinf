defaults:
- model/pi0_5@actor.model
- hybrid_engines/openpi_fsdp@actor.fsdp_config
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    actor: 1
runner:
  task_type: sft
  logger:
    log_path: /mnt/20T-1/sudu/.data/RLinf/g1_rlt/20261027_1042
    project_name: rlinf-rlt
    experiment_name: stage1
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 5000
  resume_dir: null
data:
  train_data_paths: /mnt/20T-1/sudu/.data/20260826_0908_merged_delete14_v3.0
  num_workers: 1
  episode_split_path: /mnt/20T-1/sudu/.data/RLinf/g1_rlt/20261027_1042/episode_split.json
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 32
  seed: 42
  model:
    precision: bf16
    model_type: openpi
    is_lora: false
    model_path: /mnt/20T-1/sudu/.result/zh_g1_zip_tie_1677_sft_b256_40k_v1_2w_rlinf_torch
    num_action_chunks: 50
    action_dim: 16
    add_value_head: false
    num_steps: 10
    openpi_data:
      repo_id: g1
      norm_stats_path: /mnt/20T-1/sudu/.result/zh_g1_zip_tie_1677_sft_b256_40k_v1_2w_rlinf_torch/assets/norm_stats.json
    openpi:
      embed_dtype: bf16
      task: sft
      config_name: pi05_g1_dualgripper
      num_images_in_input: 3
      train_expert_only: false
      noise_method: flow_noise
      noise_params:
      - 0.16
      - 0.12
      - 200
      joint_logprob: true
      detach_critic_input: true
      action_horizon: 50
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      discrete_state_input: true
      use_rlt: true
      freeze_vla: true
      rlt_alpha: 0.0
      rlt_prefix_seq_len: 1024
      rlt_image_only: false
      rlt_use_mask: true
      torch_compile: false
  optim:
    lr: 1.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 20000
    lr_warmup_steps: 1000
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 2.5e-06
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    wrappers:
      rlt_features:
        module_names:
        - rlt_module
        wrap_mode: subtree
    mixed_precision_rules:
      rlt_features: fp32
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: fp32
    cpu_offload: false
    limit_all_gathers: true
    enable_gradient_accumulation: true
  enable_offload: false
