# G1 task settings use the official RECAP value SFT recipe.
defaults:
- model/recap_value_model@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: '0'
runner:
  task_type: sft
  logger:
    log_path: /mnt/20T-1/sudu/.data/.model
    project_name: rlinf
    experiment_name: g1_recap_value_20261123
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 8000
  val_check_interval: 500
  save_interval: 1000
data:
  tag: full_episode_gamma1_fail300
  train_data_paths:
  - dataset_path: /mnt/20T-1/sudu/.data/recap_g1_20261120/datasets/20260826_0908_merged_delete14
    robot_type: g1
    model_type: pi05
    type: sft
    weight: 3.0
  - dataset_path: /mnt/20T-1/sudu/.data/recap_g1_20261120/datasets/zd_105_261111
    robot_type: g1
    model_type: pi05
    type: rollout
    weight: 1.0
  - dataset_path: /mnt/20T-1/sudu/.data/recap_g1_20261120/datasets/zd_50_261120
    robot_type: g1
    model_type: pi05
    type: rollout
    weight: 1.0
  - dataset_path: /mnt/20T-1/sudu/.data/recap_g1_20261120/datasets/zd_89_261027
    robot_type: g1
    model_type: pi05
    type: rollout
    weight: 1.0
  eval_data_paths:
  - dataset_path: /mnt/20T-1/sudu/.data/recap_g1_20261120/datasets/20260826_0908_merged_delete14
    robot_type: g1
    model_type: pi05
    name: 20260826_0908_merged_delete14
    max_samples: null
  - dataset_path: /mnt/20T-1/sudu/.data/recap_g1_20261120/datasets/zd_105_261111
    robot_type: g1
    model_type: pi05
    name: zd_105_261111
    max_samples: null
  - dataset_path: /mnt/20T-1/sudu/.data/recap_g1_20261120/datasets/zd_50_261120
    robot_type: g1
    model_type: pi05
    name: zd_50_261120
    max_samples: null
  - dataset_path: /mnt/20T-1/sudu/.data/recap_g1_20261120/datasets/zd_89_261027
    robot_type: g1
    model_type: pi05
    name: zd_89_261027
    max_samples: null
  train_num_workers: 12
  eval_num_workers: 6
  prefetch_factor: 2
  persistent_workers: false
  pin_memory: true
  include_state: true
  gamma: 1.0
  action_horizon: 10
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 16
  robot_type: g1
  model_type: pi05
  balance_weights: false
  seed: 42
  return_min: -2088.0
  return_max: 0.0
  dataset:
    _target_: rlinf.data.datasets.recap.g1_value_dataset.G1ValueDataset
    _partial_: true
    _convert_: all
    split_manifest: /mnt/20T-1/sudu/.result/recap_g1_value_20261123/setup/episode_split.json
    repack_keys:
      images:
        cam_high: observation.images.cam_left_high
        cam_left_wrist: observation.images.cam_left_wrist
        cam_right_wrist: observation.images.cam_right_wrist
      state: observation.state
      actions: action
      prompt: prompt
algorithm:
  adv_type: gae
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 20
  global_batch_size: 260
  seed: 0
  model:
    precision: bf16
    siglip_path: /mnt/20T-1/sudu/.data/.model/recap_models/siglip2-so400m-patch14-224
    gemma3_path: /mnt/20T-1/sudu/.data/.model/recap_models/gemma-3-270m
    tokenizer_path: /mnt/20T-1/sudu/.data/.model/recap_models/gemma-3-270m
    freeze_vlm: false
    action_dim: 16
    action_horizon: 10
  optim:
    lr: 5.0e-05
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: constant
    lr_warmup_steps: 500
    total_training_steps: 8000
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
